<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f1624;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid #06b6d4;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // This script forces a clean reload of the homepage with proper scrolling
    window.onload = function() {
      // Apply scrolling fix to parent window
      if (window.opener) {
        window.opener.document.body.style.overflow = 'auto';
        window.opener.document.body.style.height = 'auto';
        window.opener.document.documentElement.style.overflow = 'auto';
        window.opener.document.documentElement.style.height = 'auto';
      }
      
      // Redirect back to homepage after a short delay
      setTimeout(function() {
        window.location.href = '/';
      }, 1500);
    };
  </script>
</head>
<body>
  <div>
    <div class="loader"></div>
    <p>Fixing scrolling issue...</p>
    <p>You will be redirected to the homepage in a moment.</p>
  </div>
</body>
</html>
